<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Game Bazz - লুডু</title>

    <!-- নিয়ন ফন্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- PeerJS: খেলার লাইভ যোগাযোগ (চাল ও ডাইস) -->

<body>

    <!-- ==========================================================
         ১. ফেসবুক/মেসেঞ্জারের ইন-অ্যাপ ব্রাউজারের সতর্কবার
            (home.js শুধু তখনই দেখাবে যখন ওই ব্রাউজারে খোলা হবে)
         ========================================================== -->
    <div id="inapp-banner" class="inapp-banner" hidden>
        <span class="inapp-text">⚠️ মেসেঞ্জারের ব্রাউজারে গেম কেটে যেতে পারে। <b>Chrome-এ</b> খুলুন।</span>
        <button id="open-chrome-btn" class="mini-btn mini-btn-neon" type="button">Chrome-এ খুলুন</button>
        <button id="inapp-close-btn" class="mini-btn" type="button" aria-label="বন্ধ করুন">✕</button>
    </div>

    <!-- ==========================================================
         ২. গেমের উপরের স্ট্যাটাস বার (লোগো + রুমের নাম + কানেকশন + বাটন)
         ========================================================== -->
    <div id="hud" class="hud">
        <div class="hud-left">
            <div class="gamebazz-logo-badge">
                <span class="logo-icon">🎲</span>
                <span class="logo-text">Game Bazz</span>
            </div>
        </div>

        <div class="hud-right">
            <span id="conn-dot" class="conn-dot conn-off" title="কানেকশন"></span>
            <span id="room-title" class="room-title"></span>
            <button id="reset-btn" class="mini-btn" type="button">🔄 রিসেট</button>
            <button id="lobby-btn" class="mini-btn" type="button">🏠 লবি</button>
        </div>
    </div>

    <!-- কার চাল চলছে তার ব্যাজ -->
    <div id="turn-badge" class="turn-badge" hidden></div>

    <!-- ==========================================================
         ৩. কানেকশন / অপেক্ষার পপআপ
            (বন্ধুর জন্য অপেক্ষা, রিকানেক্ট হচ্ছে, রুম পূর্ণ ইত্যাদি)
         ========================================================== -->
    <div id="conn-overlay" class="overlay">
        <div class="lobby-card">
            <div id="conn-spinner" class="spinner"></div>
            <h2 id="conn-title">রুমে যুক্ত হচ্ছে...</h2>
            <p id="conn-msg" class="conn-msg"></p>
            <button id="conn-retry-btn" class="restart-btn" type="button" hidden>🔁 আবার চেষ্টা করুন</button>
            <button id="conn-lobby-btn" class="ghost-btn" type="button">🏠 লবিতে ফিরুন</button>
        </div>
    </div>

    <!-- ==========================================================
         ৪. রিসেট নিশ্চিতকরণ পপআপ
         ========================================================== -->
    <div id="confirm-overlay" class="overlay" hidden>
        <div class="lobby-card">
            <h2>গেম রিসেট করবেন?</h2>
            <p class="conn-msg">সব গুটি নিজের ঘরে ফিরে যাবে এবং দুজনেরই নতুন খেলা শুরু হবে।</p>
            <div class="btn-row">
                <button id="confirm-no-btn" class="ghost-btn" type="button">না</button>
                <button id="confirm-yes-btn" class="restart-btn" type="button">হ্যাঁ, রিসেট করুন</button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         ৫. বিজয়ী পপআপ (এখান থেকেই আবার খেলা বা লবিতে ফেরা যাবে)
         ========================================================== -->
    <div id="win-overlay" class="overlay" hidden>
        <div class="win-card">
            <div class="win-icon">🏆</div>
            <h2>অভিনন্দন!</h2>
            <p id="win-message"></p>
            <div class="btn-row">
                <button id="win-lobby-btn" class="ghost-btn" type="button">🏠 লবি</button>
                <button id="win-restart-btn" class="restart-btn" type="button">🔄 আবার খেলুন</button>
            </div>
        </div>
    </div>

            ক্লিক ইভেন্ট home.js বসাবে, এখানে কোনো onclick নেই।
            আগের বাগ ঠিক করা হয়েছে: দুটো ডাইসেরই ৬টি পিঠ এখন সঠিক।
         ========================================================== -->

    <!-- হলুদের ডাইস (ডিফল্টে উপরে) -->
    <div id="dice-top-right" class="dice-container">
        <div class="cube">
            <div class="face front"><svg viewBox="0 0 100 100" class="dice-svg"><circle cx="50" cy="50" r="12"/></svg></div>
            <div class="face back"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="28" cy="25" r="10"/><circle cx="28" cy="50" r="10"/><circle cx="28" cy="75" r="10"/>
                <circle cx="72" cy="25" r="10"/><circle cx="72" cy="50" r="10"/><circle cx="72" cy="75" r="10"/>
            </svg></div>
            <div class="face right"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="25" cy="25" r="10"/><circle cx="50" cy="50" r="10"/><circle cx="75" cy="75" r="10"/>
            </svg></div>
            <div class="face left"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="28" cy="28" r="10"/><circle cx="28" cy="72" r="10"/>
                <circle cx="72" cy="28" r="10"/><circle cx="72" cy="72" r="10"/>
            </svg></div>
            <div class="face top"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="28" cy="28" r="10"/><circle cx="72" cy="72" r="10"/>
            </svg></div>
            <div class="face bottom"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="25" cy="25" r="10"/><circle cx="25" cy="75" r="10"/><circle cx="50" cy="50" r="10"/>
                <circle cx="75" cy="25" r="10"/><circle cx="75" cy="75" r="10"/>
            </svg></div>
        </div>
    </div>
