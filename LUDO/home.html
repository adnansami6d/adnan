<!DOCTYPE html>

    <meta name="theme-color" content="#F5F6F8">
    <title>Ludo</title>

    <!-- Inter ফন্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PeerJS: খেলার লাইভ যোগাযোগ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<body>

    <!-- ১. মেসেঞ্জার/ফেসবুক ব্রাউজারের সতর্কবার (extras.js দেখাবে) -->
    <div id="inapp-banner" class="inapp-banner" hidden>
        <span class="inapp-text">Open in Chrome for a stable game</span>
        <button id="open-chrome-btn" class="pill-btn" type="button">Open</button>
        <button id="inapp-close-btn" class="icon-btn icon-btn-sm" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </div>

    <!-- ২. ওপরের হালকা বার: বাঁয়ে কানেকশন ডট, ডানে আইকন বাটন -->
    <div id="hud" class="hud">
        <div class="hud-left">
            <span id="conn-dot" class="conn-dot conn-off"></span>
        </div>
        <div class="hud-right">
            <!-- নতুন খেলা -->
            <button id="reset-btn" class="icon-btn" type="button" aria-label="New game">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            </button>
            <!-- হোম -->
            <button id="lobby-btn" class="icon-btn" type="button" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
            </button>
            <!-- মাইক (extras.js কানেকশন হলে দেখাবে) -->
            <span id="voice-widget" hidden>
                <button id="mic-btn" class="icon-btn" type="button" aria-label="Microphone">
                    <svg class="mic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                    <svg class="mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path d="M3 3l18 18"/></svg>
                </button>
                <audio id="remote-voice" autoplay playsinline></audio>
            </span>
        </div>
    </div>

    <!-- কার চাল চলছে (Your turn / Their turn) -->
    <div id="turn-badge" class="turn-badge" hidden></div>

    <!-- ==========================================================
         ৩. লবি কার্ড
            ভেতরের অংশ extras.js বানায় (Create Room / Copy / Share / Joining / Error)।
            তাই এখানে শুধু খালি খোলস।
         ========================================================== -->
    <div id="lobby-overlay" class="overlay"></div>

    <!-- কানেকশন হারালে -->
    <div id="conn-overlay" class="overlay" hidden>
        <div class="lobby-card">
            <h2 id="conn-title">Connection lost</h2>
            <p id="conn-msg" class="conn-msg"></p>
            <button id="conn-lobby-btn" class="restart-btn" type="button">Home</button>
        </div>
    </div>

    <!-- নতুন খেলার নিশ্চিতকরণ -->
    <div id="confirm-overlay" class="overlay" hidden>
        <div class="lobby-card">
            <h2>Start a new game?</h2>
            <div class="btn-row">
                <button id="confirm-no-btn" class="ghost-btn" type="button">Cancel</button>
                <button id="confirm-yes-btn" class="restart-btn" type="button">Start</button>
            </div>
        </div>
    </div>

    <!-- জেতার পর -->
    <div id="win-overlay" class="overlay" hidden>
        <div class="win-card">
            <h2 id="win-message"></h2>
            <div class="btn-row">
                <button id="win-lobby-btn" class="ghost-btn" type="button">Home</button>
                <button id="win-restart-btn" class="restart-btn" type="button">Play again</button>
            </div>
        </div>
    </div>

    <!-- হলুদের ডাইস (ডিফল্টে উপরে) -->
    <div id="dice-top-right" class="dice-container">
        <div class="cube">
            <div class="face front"><svg viewBox="0 0 100 100" class="dice-svg"><circle cx="50" cy="50" r="12"/></svg></div>
            <div class="face back"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="28" cy="25" r="10"/><circle cx="28" cy="50" r="10"/><circle cx="28" cy="75" r="10"/>
                <circle cx="72" cy="25" r="10"/><circle cx="72" cy="50" r="10"/><circle cx="72" cy="75" r="10"/>
            </svg></div>
            <div class="face right"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="25" cy="25" r="10"/><circle cx="50" cy="50" r="10"/><circle cx="75" cy="75" r="10"/>
            </svg></div>
            <div class="face left"><svg viewBox="0 0 100 100" class="dice-svg">
                <circle cx="28" cy="28" r="10"/><circle cx="28" cy="72" r="10"/>
                <circle cx="72" cy="28" r="10"/><circle cx="72" cy="72" r="10"/>
            </svg></div>
            <div class="face top"><svg viewBox="0 0 100 100" class="dice-svg">

            </svg></div>
            <div class="face bottom"><svg viewBox="0 0 100 100" class="dice-svg">
