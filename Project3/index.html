<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <title>Game Bazz - অনলাইন লুডু</title>

    <!-- নিয়ন ফন্ট (লোগো ও হেডিং-এর জন্য) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- ============ ব্যাকগ্রাউন্ড গ্লো (শুধু সাজসজ্জা) ============ -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- ============ উপরের বার: লোগো ============ -->
    <header class="top-bar">
        <div class="gamebazz-logo-badge">
            <span class="logo-icon">🎲</span>
            <span class="logo-text">Game Bazz</span>
        </div>
    </header>

    <main class="page">

        <!-- ============ হিরো / শিরোনাম ============ -->
        <section class="hero">
            <h1>অনলাইন লুডু</h1>
            <p class="hero-sub">বন্ধুর সাথে রিয়েলটাইমে খেলুন। রুম বেছে নিন অথবা নিজের রুম খুলুন।</p>
        </section>

        <!-- ============ অ্যাকশন বার: রুম তৈরি ও রিফ্রেশ ============ -->
        <section class="actions">
            <button id="create-room-open-btn" class="btn btn-primary" type="button">
                ➕ নতুন রুম তৈরি করুন
            </button>
            <button id="refresh-btn" class="btn btn-ghost" type="button" title="তালিকা রিফ্রেশ করুন">
                🔄 রিফ্রেশ
            </button>
        </section>

        <!-- ============ আগের চলমান ম্যাচে ফিরে যাওয়ার ব্যানার (JS দেখাবে/লুকাবে) ============ -->
        <section id="resume-banner" class="resume-banner" hidden>
            <div class="resume-text">
                <strong>আপনার একটি অসমাপ্ত ম্যাচ আছে</strong>
                <span id="resume-room-name"></span>
            </div>
            <button id="resume-btn" class="btn btn-success" type="button">▶ ফিরে যান</button>
        </section>

        <!-- ============ রুমের তালিকা ============ -->
        <section class="rooms-section">
            <div class="rooms-head">
                <h2>রুম তালিকা</h2>
                <span id="rooms-count" class="rooms-count"></span>
            </div>

            <!-- লোড হচ্ছে -->
            <div id="rooms-loading" class="state-box">
                <div class="spinner"></div>
                <p>রুম লোড হচ্ছে...</p>
            </div>

            <!-- কোনো রুম নেই -->
            <div id="rooms-empty" class="state-box" hidden>
                <div class="state-icon">🕹️</div>
                <p>এখন কোনো রুম নেই। প্রথম রুমটি আপনিই খুলুন!</p>
            </div>

            <!-- এরর (নেট বা Firebase সমস্যা) -->
            <div id="rooms-error" class="state-box state-error" hidden>
                <div class="state-icon">⚠️</div>
                <p id="rooms-error-text">রুম লোড করা যায়নি।</p>
                <button id="retry-btn" class="btn btn-ghost" type="button">আবার চেষ্টা করুন</button>
            </div>

            <!-- কার্ডগুলো এখানে JS দিয়ে বসবে -->
            <div id="rooms-list" class="rooms-list"></div>
        </section>
    </main>

    <!-- ============ রুম কার্ড টেমপ্লেট (JS এটি ক্লোন করে ব্যবহার করবে) ============ -->
    <template id="room-card-template">
        <article class="room-card">
            <div class="room-card-main">
                <h3 class="room-name"></h3>
                <div class="room-badges">
                    <span class="badge badge-status"></span>
                    <span class="badge badge-type"></span>
                </div>
            </div>
            <button class="btn btn-join" type="button">জয়েন</button>
        </article>
    </template>

    <!-- ============ পপআপ ১: নতুন রুম তৈরি ============ -->
    <div id="create-modal" class="modal-overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
            <h2 id="create-modal-title">নতুন রুম তৈরি করুন</h2>

            <label class="field">
                <span>রুমের নাম</span>
                <input id="room-name-input" type="text" maxlength="24" placeholder="যেমন: বন্ধুদের আড্ডা" autocomplete="off">
            </label>

            <label class="field">
                <span>পিন <small>(ঐচ্ছিক, দিলে রুম প্রাইভেট হবে)</small></span>
                <input id="room-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="৪-৬ সংখ্যার পিন" autocomplete="off">
            </label>

            <p id="create-error" class="form-error" hidden></p>

            <div class="modal-actions">
                <button id="create-cancel-btn" class="btn btn-ghost" type="button">বাতিল</button>
                <button id="create-submit-btn" class="btn btn-primary" type="button">তৈরি করুন</button>
            </div>
        </div>
    </div>

    <!-- ============ পপআপ ২: প্রাইভেট রুমে পিন দিয়ে জয়েন ============ -->
    <div id="pin-modal" class="modal-overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pin-modal-title">
            <h2 id="pin-modal-title">🔒 প্রাইভেট রুম</h2>
            <p id="pin-room-name" class="modal-sub"></p>

            <label class="field">
                <span>পিন লিখুন</span>
                <input id="join-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="পিন" autocomplete="off">
            </label>

            <p id="pin-error" class="form-error" hidden></p>

            <div class="modal-actions">
                <button id="pin-cancel-btn" class="btn btn-ghost" type="button">বাতিল</button>
                <button id="pin-submit-btn" class="btn btn-primary" type="button">জয়েন করুন</button>
            </div>
        </div>
    </div>

    <!-- ============ টোস্ট মেসেজ (ছোট নোটিফিকেশন) ============ -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- ============ ফুটার ক্রেডিট ============ -->
    <footer class="footer-credit">© Since 2026 ❤️<br>powered by Adnan Sami</footer>

    <script src="index.js"></script>
</body>
</html>
