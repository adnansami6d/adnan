<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Jon the Don</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }

        /* মূল স্প্লিট কন্টেইনার (বাম পাশে ছবি, ডান পাশে লগইন ফর্ম) */
        .login-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .login-container {
                max-width: 860px;
                height: 520px;
                border-radius: 20px;
                flex-direction: row;
                border: 1px solid rgba(226, 232, 240, 0.8);
            }
        }

        /* বাম পাশ: জনের ছবি ও ব্র্যান্ডিং এরিয়া */
        .login-banner-side {
            width: 100%;
            height: 35%;
            background: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        @media (min-width: 768px) {
            .login-banner-side {
                width: 45%;
                height: 100%;
            }
        }

        .login-banner-side img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.2));
        }

        .banner-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
        }

        .banner-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #34d399;
            margin-bottom: 4px;
        }

        .banner-content p {
            font-size: 0.78rem;
            color: #cbd5e1;
        }

        /* ডান পাশ: লগইন ফর্ম এরিয়া */
        .login-form-side {
            width: 100%;
            height: 65%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            background: #ffffff;
        }

        @media (min-width: 768px) {
            .login-form-side {
                width: 55%;
                height: 100%;
                padding: 32px;
            }
        }

        .form-header {
            margin-bottom: 18px;
        }

        .form-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .form-header p {
            font-size: 0.8rem;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
            color: #0f172a;
        }

        .input-field:focus {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .forgot-pass-container {
            text-align: right;
            margin-bottom: 14px;
            margin-top: -6px;
        }

        .forgot-pass-container a {
            font-size: 0.76rem;
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-pass-container a:hover { text-decoration: underline; }

        .login-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .login-btn:hover { background: #059669; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .register-link {
            text-align: center;
            margin-top: 14px;
            font-size: 0.82rem;
            color: #64748b;
        }

        .register-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover { text-decoration: underline; }

        #form-message {
            font-size: 0.78rem;
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
            min-height: 18px;
        }

        .success-msg { color: #16a34a; }
        .error-msg { color: #dc2626; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal styling for Forgot Password */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1050;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            animation: modalFade 0.25s ease;
        }

        @keyframes modalFade {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 1.05rem;
            color: #0f172a;
        }

        .close-modal {
            background: #e2e8f0;
            border: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- বাম পাশ: জনের ছবি ও ব্র্যান্ডিং -->
        <div class="login-banner-side">
            <img src="https://i.ibb.co.com/gbLbq7pw/images.jpg" alt="Jon the Don">
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <h2>Jon the Don</h2>
                <p>শিক্ষার আলোয় উদ্ভাসিত হোক প্রতিটি জীবন। আপনার অ্যাকাউন্টে প্রবেশ করুন।</p>
            </div>
        </div>

        <!-- ডান পাশ: লগইন ফর্ম অপশন -->
        <div class="login-form-side">
            <div class="form-header">
                <h3>লগইন করুন</h3>
                <p>আপনার অ্যাকাউন্টে প্রবেশ করতে তথ্য দিন</p>
            </div>

            <form id="loginForm">
                
                <!-- ফোন নম্বর বা ইমেইল -->
                <div class="input-group">
                    <label for="userContact"><i class="fa-solid fa-envelope"></i> ফোন নম্বর বা ইমেইল</label>
                    <input type="text" id="userContact" class="input-field" placeholder="017xxxxxxxx অথবা email@mail.com" required>
                </div>

                <!-- পাসওয়ার্ড -->
                <div class="input-group">
                    <label for="userPassword"><i class="fa-solid fa-lock"></i> পাসওয়ার্ড</label>
                    <input type="password" id="userPassword" class="input-field" placeholder="আপনার পাসওয়ার্ড দিন" required>
                </div>

                <div class="forgot-pass-container">
                    <a href="#" onclick="openForgotModal(event)">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <!-- স্ট্যাটাস মেসেজ -->
                <div id="form-message"></div>

                <!-- সাবমিট বাটন -->
                <button type="submit" id="submitBtn" class="login-btn">
                    <span id="btnText">লগইন করুন</span>
                </button>

                <div class="register-link">
                    একাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন করুন</a>
                </div>
            </form>
        </div>

    </div>

    <!-- ফরগট পাসওয়ার্ড রিকভারি মোডাল -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>অ্যাকাউন্ট রিকভারি</h3>
                <button class="close-modal" onclick="closeForgotModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="forgotForm" onsubmit="handleForgotRecovery(event)">
                <div class="input-group">
                    <label>আপনার ফোন নম্বর বা ইমেইল</label>
                    <input type="text" id="recContact" class="input-field" placeholder="রেজিস্টার্ড ফোন বা ইমেইল" required>
                </div>
                <div class="input-group">
                    <label>আপনার নাম (User Name)</label>
                    <input type="text" id="recName" class="input-field" placeholder="আপনার সম্পূর্ণ নাম" required>
                </div>
                <div class="input-group">
                    <label>আপনার শ্রেণি (Class)</label>
                    <input type="text" id="recClass" class="input-field" placeholder="যেমন: HSC / Honours" required>
                </div>
                <div class="input-group">
                    <label>আপনার অ্যাকাউন্টের বর্তমান ব্যালেন্স (Diamonds)</label>
                    <input type="number" id="recBalance" class="input-field" placeholder="যেমন: 0 বা 50" required>
                </div>
                <div id="recMessage" style="font-size: 0.78rem; margin-bottom: 10px; min-height: 15px; text-align: center;"></div>
                <button type="submit" id="recBtn" class="login-btn">যাচাই করে প্রবেশ করুন</button>
            </form>
        </div>
    </div>

    <!-- JavaScript লজিক -->
    <script>
        const usersEndpoint = "https://firestore.googleapis.com/v1/projects/tournament-2d6d4/databases/(default)/documents/users";
        const apiKey = "?key=AIzaSyCNvnJsIn4-oKHLVv7-oNHCTskjE8";

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const formMessage = document.getElementById('form-message');

        // SHA-256 পাসওয়ার্ড হ্যাশিং ফাংশন
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            let contactInput = document.getElementById('userContact').value.trim();
            const password = document.getElementById('userPassword').value;

            if (!contactInput || !password) {
                showFeedback('সবগুলো ঘর পূরণ করুন।', 'error');
                return;
            }

            setLoading(true, submitBtn, btnText);
            showFeedback('যাচাই করা হচ্ছে...', 'success');

            try {
                let possibleContacts = [contactInput];
                if (contactInput.startsWith('0')) {
                    possibleContacts.push(contactInput.substring(1));
                } else if (/^\d+$/.test(contactInput)) {
                    possibleContacts.push('0' + contactInput);
                }

                const response = await fetch(usersEndpoint + apiKey);
                const data = await response.json();

                if (!data.documents) {
                    showFeedback('কোনো ব্যবহারকারী পাওয়া যায়নি।', 'error');
                    setLoading(false, submitBtn, btnText);
                    return;
                }

                let matchedUserDoc = null;
                for (let doc of data.documents) {
                    const fields = doc.fields;
                    const dbContact = fields["Phone /email"] ? fields["Phone /email"].stringValue.trim() : "";
                    
                    if (possibleContacts.includes(dbContact)) {
                        matchedUserDoc = fields;
                        break;
                    }
                }

                if (!matchedUserDoc) {
                    showFeedback('ভুল ফোন নম্বর বা ইমেইল!', 'error');
                    setLoading(false, submitBtn, btnText);
                    return;
                }

                const inputHashedPassword = await hashPassword(password);
                const dbHashedPassword = matchedUserDoc["Passhas"] ? matchedUserDoc["Passhas"].stringValue : "";

                if (inputHashedPassword !== dbHashedPassword) {
                    showFeedback('পাসওয়ার্ড ভুল হয়েছে!', 'error');
                    setLoading(false, submitBtn, btnText);
                    return;
                }

                saveUserSessionAndRedirect(matchedUserDoc);

            } catch (err) {
                console.error("Login Error:", err);
                showFeedback('একটি ত্রুটি ঘটেছে। ইন্টারনেট কানেকশন চেক করুন।', 'error');
                setLoading(false, submitBtn, btnText);
            }
        });

        // ফরগট পাসওয়ার্ড মোডাল ওপেন/ক্লোজ
        function openForgotModal(e) {
            e.preventDefault();
            document.getElementById('forgotModal').style.display = 'flex';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
            document.getElementById('forgotForm').reset();
            document.getElementById('recMessage').textContent = '';
        }

        // ফরগট পাসওয়ার্ড রিকভারি যাচাই লজিক
        async function handleForgotRecovery(e) {
            e.preventDefault();
            const contact = document.getElementById('recContact').value.trim();
            const name = document.getElementById('recName').value.trim().toLowerCase();
            const userClass = document.getElementById('recClass').value.trim().toLowerCase();
            const balanceInput = Number(document.getElementById('recBalance').value);
            const recMsg = document.getElementById('recMessage');

            recMsg.style.color = "#0284c7";
            recMsg.textContent = "তথ্য যাচাই করা হচ্ছে...";

            try {
                let possibleContacts = [contact];
                if (contact.startsWith('0')) {
                    possibleContacts.push(contact.substring(1));
                } else if (/^\d+$/.test(contact)) {
                    possibleContacts.push('0' + contact);
                }

                const response = await fetch(usersEndpoint + apiKey);
                const data = await response.json();

                if (!data.documents) {
                    recMsg.style.color = "#dc2626";
                    recMsg.textContent = "কোনো ব্যবহারকারী পাওয়া যায়নি।";
                    return;
                }

                let matchedUserDoc = null;
                for (let doc of data.documents) {
                    const fields = doc.fields;
                    const dbContact = fields["Phone /email"] ? fields["Phone /email"].stringValue.trim() : "";
                    const dbName = fields["users Name"] ? fields["users Name"].stringValue.trim().toLowerCase() : "";
                    const dbClass = fields["userclass"] ? fields["userclass"].stringValue.trim().toLowerCase() : "";
                    
                    if (possibleContacts.includes(dbContact) && dbName === name && dbClass === userClass) {
                        matchedUserDoc = fields;
                        break;
                    }
                }

                if (!matchedUserDoc) {
                    recMsg.style.color = "#dc2626";
                    recMsg.textContent = "তথ্যগুলো সঠিক নয়! পুনরায় চেষ্টা করুন।";
                    return;
                }

                recMsg.style.color = "#16a34a";
                recMsg.textContent = "যাচাই সফল! প্রবেশ করানো হচ্ছে...";

                setTimeout(() => {
                    saveUserSessionAndRedirect(matchedUserDoc);
                }, 1000);

            } catch (err) {
                console.error("Recovery Error:", err);
                recMsg.style.color = "#dc2626";
                recMsg.textContent = "সার্ভার ত্রুটি। আবার চেষ্টা করুন।";
            }
        }

        
        // সেশন তৈরি করে হোম পেজে রিডাইরেক্ট করার কমন ফাংশন
        function saveUserSessionAndRedirect(matchedUserDoc) {
            const userId = matchedUserDoc["I'd"] ? matchedUserDoc["I'd"].stringValue : "";
            const userName = matchedUserDoc["users Name"] ? matchedUserDoc["users Name"].stringValue : "";
            const userClass = matchedUserDoc["userclass"] ? matchedUserDoc["userclass"].stringValue : "";
            const level = matchedUserDoc["level"] ? matchedUserDoc["level"].stringValue : "free";
            const profilePic = matchedUserDoc["profile pic"] ? matchedUserDoc["profile pic"].stringValue : "";

            const sessionExpiryDays = 6;
            const expiryDate = new Date().getTime() + (sessionExpiryDays * 24 * 60 * 60 * 1000);
            
            const userSession = {
                userId,
                userName,
                userClass,
                level,
                profilePic,
                expiresAt: expiryDate
            };

            localStorage.setItem('userSession', JSON.stringify(userSession));

            showFeedback('লগইন সফল! হোম পেজে নিয়ে যাওয়া হচ্ছে...', 'success');

            setTimeout(() => {
                window.location.href = "home.html";
            }, 1000);
        }

        function showFeedback(msg, type) {
            formMessage.textContent = msg;
            formMessage.className = type === 'error' ? 'error-msg' : 'success-msg';
        }

        function setLoading(isLoading, btn, txtSpan) {
            btn.disabled = isLoading;
            if (isLoading) {
                txtSpan.style.display = 'none';
                if (!btn.querySelector('.spinner')) {
                    const spinner = document.createElement('div');
                    spinner.className = 'spinner';
                    btn.appendChild(spinner);
                }
            } else {
                txtSpan.style.display = 'inline';
                const spinner = btn.querySelector('.spinner');
                if (spinner) spinner.remove();
            }
        }
    </script>
</body>
</html>
