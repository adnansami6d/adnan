<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0f766e; --brand-l:#e6f4f2;
  --mine:#dcf8c6; --theirs:#ffffff; --bg:#f3f4f6;
  --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --danger:#dc2626; --blue:#2563eb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}

#app{position:fixed;left:0;right:0;top:0;height:100%;max-width:720px;margin:0 auto;background:#fff;overflow:hidden}
@media(min-width:760px){body{background:#eef0f3}#app{box-shadow:0 0 0 1px var(--line)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- Lock ---------- */
#lock{overflow-y:auto;background:#f8f9fb}
.lock-wrap{width:100%;max-width:360px;margin:auto;padding:28px 18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.lbl{display:block;font-size:.82rem;font-weight:500;color:#374151;margin-bottom:8px}
.pin,.txt{width:100%;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:16px;outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.pin{padding:12px 14px;text-align:center;font-size:1.25rem;letter-spacing:.45em;font-weight:500}
.pin::placeholder{color:#c3c8d0;letter-spacing:.3em}
.txt{padding:11px 13px;margin-top:10px;font-size:.95rem}
.txt::placeholder{color:#9ca3af}
.pin:focus,.txt:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.err{min-height:18px;margin-top:8px;font-size:.8rem;color:var(--danger);text-align:center}
.btn{width:100%;padding:12px;border-radius:10px;color:#fff;font-weight:600;font-size:.95rem;background:var(--brand);transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55}
.btn.dark{background:#1f2937}

/* ---------- Chat ---------- */
.hdr{display:flex;align-items:center;gap:6px;padding:max(6px,env(safe-area-inset-top)) 6px 6px;background:#fff;border-bottom:1px solid var(--line);min-height:54px;z-index:5}
.hdr .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#4b5563;flex:none}
.hdr .ib:active{background:#f0f1f3}
.hdr .ib.del{color:var(--danger)}
.status{flex:1;padding-left:4px;font-size:.82rem;color:var(--muted)}
.status.off{color:var(--danger)}
.hdr-sel{display:none;background:var(--brand-l)}
.hdr-sel b{flex:1;font-weight:600;font-size:1rem;padding-left:4px}
.selmode .hdr-normal{display:none}
.selmode .hdr-sel{display:flex}

#list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 6px;background:var(--bg);-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:#9ca3af;font-size:.88rem;margin:48px 10px}
.day{display:flex;justify-content:center;margin:12px 0 8px}
.day span{background:#fff;color:#6b7280;font-size:.72rem;padding:3px 11px;border-radius:10px;border:1px solid var(--line)}
.row{display:flex;margin:0 -10px;padding:1.5px 14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.mine{justify-content:flex-end}
.row.sel{background:rgba(15,118,110,.18)}
.bubble{max-width:82%;padding:6px 9px 5px 10px;border-radius:14px;background:var(--theirs);box-shadow:0 1px 1px rgba(17,24,39,.1);
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-end;gap:0 10px;font-size:.95rem;line-height:1.45}
.row.theirs .bubble{border-top-left-radius:4px}
.row.mine .bubble{background:var(--mine);border-top-right-radius:4px}
.txt-m{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;min-width:0}
.meta{margin-left:auto;display:inline-flex;gap:3px;align-items:center;font-size:.65rem;color:#6b7280;padding-top:2px;transform:translateY(2px);white-space:nowrap}
.tick{display:inline-flex;color:#9ca3af}
.tick .ic{width:15px;height:15px}
.tick.seen{color:var(--blue)}
.tick.pend .ic{width:12px;height:12px}
.bubble.deleted{color:#6b7280;font-style:italic;font-size:.88rem;align-items:center}
.bubble.deleted .ic{width:14px;height:14px;margin-right:6px;vertical-align:-3px}
.retry{color:var(--danger);font-size:.72rem;font-weight:600;text-decoration:underline}
.tobottom{position:absolute;right:14px;bottom:76px;min-width:40px;height:40px;padding:0 12px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(17,24,39,.15);
  display:flex;align-items:center;justify-content:center;gap:5px;color:var(--brand);font-weight:600;font-size:.85rem;z-index:4}
.tobottom .ic{transform:rotate(90deg);width:17px;height:17px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:none;outline:none;background:#f1f2f4;border-radius:21px;padding:10px 16px;font-size:16px;line-height:1.4;max-height:120px;min-height:42px}
.send{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:var(--brand)}
.send:active{transform:scale(.93)}
.send .ic{width:19px;height:19px;margin-left:-2px}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:22px;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h3{font-size:1.02rem;font-weight:600;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:.88rem;line-height:1.55}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:.9rem;background:#f1f2f4}
.sheet .acts .danger{background:var(--danger);color:#fff}
.sheet .acts .ok{background:var(--brand);color:#fff}
.bigpin{font-size:1.9rem;font-weight:600;letter-spacing:.35em;text-align:center;color:var(--ink);background:#f3f4f6;border-radius:12px;padding:14px 0 14px .35em;margin:12px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#1f2937;color:#fff;font-size:.84rem;padding:8px 15px;border-radius:18px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">

  <!-- Lock -->
  <section id="lock" class="screen active">
    <div class="lock-wrap">
      <form id="joinForm" class="card" autocomplete="off">
        <label class="lbl" for="joinPin">Enter PIN</label>
        <input id="joinPin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
        <input id="joinSecret" class="txt" type="password" placeholder="Passphrase (optional)" autocomplete="off">
        <div class="err" id="joinErr"></div>
        <button class="btn" id="joinBtn" type="submit">Continue</button>
      </form>

      <form id="newForm" class="card" autocomplete="off">
        <label class="lbl" for="newPin">New PIN</label>
        <input id="newPin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="Auto-generate" autocomplete="off">
        <input id="newSecret" class="txt" type="password" placeholder="Passphrase (optional)" autocomplete="off">
        <div class="err" id="newErr"></div>
        <button class="btn dark" id="newBtn" type="submit">Create</button>
      </form>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat" class="screen">
    <header class="hdr hdr-normal">
      <button class="ib" id="exitBtn" aria-label="Exit"><i data-ic="logout"></i></button>
      <div class="status" id="subline">Connected</div>
      <button class="ib" id="pinBtn" aria-label="Show PIN"><i data-ic="key"></i></button>
    </header>
    <header class="hdr hdr-sel">
      <button class="ib" id="selCancel" aria-label="Cancel"><i data-ic="x"></i></button>
      <b id="selCount">0 selected</b>
      <button class="ib" id="selCopy" aria-label="Copy"><i data-ic="copy"></i></button>
      <button class="ib del" id="selDel" aria-label="Delete"><i data-ic="trash"></i></button>
    </header>

    <main id="list"></main>
    <button class="tobottom hidden" id="toBottom"><i data-ic="send"></i><span id="newCnt"></span></button>

    <footer class="composer">
      <textarea id="msgInput" rows="1" placeholder="Message" autocomplete="off" autocapitalize="sentences"></textarea>
      <button class="send" id="sendBtn" aria-label="Send"><i data-ic="send"></i></button>
    </footer>
  </section>
</div>

<div class="modal" id="delModal"><div class="sheet">
  <h3>Delete messages?</h3>
  <p id="delText">Selected messages will be deleted for everyone.</p>
  <div class="acts"><button id="delNo">Cancel</button><button class="danger" id="delYes">Delete</button></div>
</div></div>

<div class="modal" id="pinModal"><div class="sheet">
  <h3>PIN</h3>
  <div class="bigpin" id="bigPin">••••••</div>
  <p id="pinNote">Share it only with the person who should join. It is not stored anywhere.</p>
  <div class="acts"><button id="pinCopy">Copy</button><button class="ok" id="pinClose">Done</button></div>
</div></div>

<div id="toast"></div>

<script>
/* ===================== Config ===================== */
const PROJECT = "tournament-2d6d4";
const API_KEY = "AIzaSyCNvnJsIn4-oKHLVv7-oNHCTskjE8";   // put your working Firebase API key here
const COL     = "secureChats";
const PBKDF2_ITER = 250000;

const DOC_ROOT = `projects/${PROJECT}/databases/(default)/documents`;
const BASE = `https://firestore.googleapis.com/v1/${DOC_ROOT}`;
const KQ = `key=${API_KEY}`;
const TR = [{ fieldPath: "updatedAt", setToServerValue: "REQUEST_TIME" }];

/* ===================== Icons ===================== */
const ICONS = {
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="m16 7 3 3"/><path d="m14 9 2 2"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  checks:'<path d="M1.5 12.5l5 5L17 6.5"/><path d="M11 16.5l1 1L23 6.5"/>'
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
document.querySelectorAll('i[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });

/* ===================== Helpers ===================== */
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = (buf) => { let s=''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = (u8) => Array.from(u8).map(b => b.toString(16).padStart(2,'0')).join('');
const randId = (n=12) => hex(crypto.getRandomValues(new Uint8Array(n)));
const FS = (v) => ({ stringValue: v });
const FB = (v) => ({ booleanValue: v });
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const fmtTime = new Intl.DateTimeFormat('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
const fmtDate = new Intl.DateTimeFormat('en-US', { day:'numeric', month:'short', year:'numeric' });
const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
function dayLabel(ts){
  const now = Date.now();
  if (dayKey(ts) === dayKey(now)) return 'Today';
  if (dayKey(ts) === dayKey(now - 86400000)) return 'Yesterday';
  return fmtDate.format(new Date(ts));
}

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* Random per-browser id, only used to tell "my" messages from the other person's */
let ME;
try { ME = localStorage.getItem('sc_dev'); if (!ME) { ME = randId(10); localStorage.setItem('sc_dev', ME); } }
catch { ME = randId(10); }

/* ===================== Crypto ===================== */
async function deriveKeys(pin, secret){
  const base = await crypto.subtle.importKey('raw', enc.encode(JSON.stringify(['sc1', pin, secret || ''])), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', hash:'SHA-256', salt: enc.encode('secret-chat-salt-v1'), iterations: PBKDF2_ITER }, base, 512);
  const bytes = new Uint8Array(bits);
  const key = await crypto.subtle.importKey('raw', bytes.slice(0,32), 'AES-GCM', false, ['encrypt','decrypt']);
  const roomId = hex(bytes.slice(32));
  return { key, roomId };
}
async function encryptText(key, text, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData: enc.encode(aad) }, key, enc.encode(text));
  return { ct: b64(ct), iv: b64(iv) };
}
async function decryptText(key, ct, iv, aad){
  try {
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(iv), additionalData: enc.encode(aad) }, key, unb64(ct));
    return dec.decode(pt);
  } catch { return null; }
}

/* ===================== Firestore REST ===================== */
async function api(url, opts){
  const r = await fetch(url, opts);
  if (!r.ok) {
    const e = new Error('HTTP ' + r.status); e.status = r.status;
    try { e.body = await r.json(); } catch {}
    throw e;
  }
  return r.json();
}
const jpost = (url, body) => api(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
const commit = (writes) => jpost(`${BASE}:commit?${KQ}`, { writes });
const msgName = (roomId, id) => `${DOC_ROOT}/${COL}/${roomId}/messages/${id}`;

async function getRoom(roomId){
  try { return await api(`${BASE}/${COL}/${roomId}?${KQ}`); }
  catch (e) { if (e.status === 404) return null; throw e; }
}
async function createRoomDoc(roomId, key){
  const { ct, iv } = await encryptText(key, 'ok-v1', 'check');
  return jpost(`${BASE}/${COL}?documentId=${roomId}&${KQ}`, {
    fields: { ct: FS(ct), iv: FS(iv), createdAt: { timestampValue: new Date().toISOString() } }
  });
}

/* ===================== State ===================== */
let S = null;
const list = $('list'), input = $('msgInput');

function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
function setBusy(btn, busy, text){ btn.disabled = busy; btn.textContent = busy ? 'Please wait…' : text; }
function errMsg(e){
  if (e === 'notfound' || e === 'wrong') return 'Invalid PIN.';
  if (e === 'exists') return 'This PIN is already in use. Try another.';
  if (e && e.status === 403) return 'Permission denied. Check Firestore rules.';
  return 'Connection error. Please try again.';
}
const cleanPin = (el) => { el.value = el.value.replace(/\D/g, '').slice(0, 6); };
['joinPin','newPin'].forEach(id => $(id).addEventListener('input', e => cleanPin(e.target)));

/* ----- Join ----- */
$('joinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = $('joinPin').value, secret = $('joinSecret').value;
  $('joinErr').textContent = '';
  if (pin.length !== 6) { $('joinErr').textContent = 'PIN must be 6 digits.'; return; }
  setBusy($('joinBtn'), true, 'Continue'); await sleep(30);
  try {
    const { key, roomId } = await deriveKeys(pin, secret);
    const doc = await getRoom(roomId);
    if (!doc) throw 'notfound';
    const ok = await decryptText(key, doc.fields.ct.stringValue, doc.fields.iv.stringValue, 'check');
    if (ok !== 'ok-v1') throw 'wrong';
    openChat(key, roomId, pin, !!secret, false);
  } catch (err) { $('joinErr').textContent = errMsg(err); }
  setBusy($('joinBtn'), false, 'Continue');
});

/* ----- Create ----- */
$('newForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const custom = $('newPin').value, secret = $('newSecret').value;
  $('newErr').textContent = '';
  if (custom && custom.length !== 6) { $('newErr').textContent = 'PIN must be 6 digits.'; return; }
  setBusy($('newBtn'), true, 'Create'); await sleep(30);
  try {
    let pin = custom, keys = null;
    for (let i = 0; i < 6; i++) {
      if (!custom) pin = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
      keys = await deriveKeys(pin, secret);
      if (!(await getRoom(keys.roomId))) break;
      if (custom) throw 'exists';
      keys = null;
    }
    if (!keys) throw new Error('retry');
    await createRoomDoc(keys.roomId, keys.key);
    openChat(keys.key, keys.roomId, pin, !!secret, true);
  } catch (err) {
    if (err && err.status === 409) err = 'exists';
    $('newErr').textContent = errMsg(err);
  }
  setBusy($('newBtn'), false, 'Create');
});

/* ===================== Chat ===================== */
function openChat(key, roomId, pin, hasSecret, justCreated){
  S = { key, roomId, pin, hasSecret, msgs:new Map(), lastSync:'1970-01-01T00:00:00Z',
        timer:null, selected:new Set(), seenSent:new Set(), lastActivity:Date.now(), unread:0 };
  $('joinPin').value = $('joinSecret').value = $('newPin').value = $('newSecret').value = '';
  showScreen('chat'); render(true); tick();
  if (justCreated) showPin();
}
function leaveChat(){
  if (S) clearTimeout(S.timer);
  S = null;
  list.innerHTML = ''; input.value = ''; autosize();
  $('app').classList.remove('selmode');
  closeModals();
  showScreen('lock');
}
function showPin(){
  $('bigPin').textContent = S.pin;
  $('pinNote').textContent = 'Share it only with the person who should join. It is not stored anywhere.' +
    (S.hasSecret ? ' The passphrase is also required.' : '');
  $('pinModal').classList.add('open');
}
function closeModals(){ document.querySelectorAll('.modal').forEach(m => m.classList.remove('open')); }

/* ----- Sync ----- */
async function applyDoc(s, d){
  const id = d.name.split('/').pop(), f = d.fields || {};
  const ts = parseInt(f.ts?.integerValue || '0', 10);
  const sender = f.snd?.stringValue || '';
  const old = s.msgs.get(id);
  const isNew = !old;
  if (f.deleted?.booleanValue) {
    s.msgs.set(id, { id, ts, sender, deleted:true, delBy: f.delBy?.stringValue || '' });
  } else {
    let text;
    if (old && !old.deleted && old.ct === f.ct.stringValue && old.text !== undefined) text = old.text;
    else text = await decryptText(s.key, f.ct.stringValue, f.iv.stringValue, id);
    s.msgs.set(id, { id, ts, sender, text: text === null ? 'Unable to decrypt' : text, bad: text === null,
                     ct: f.ct.stringValue, seen: !!f.seen?.booleanValue, deleted:false });
  }
  return isNew && sender !== ME;
}
async function pollOnce(s){
  let changed = false, incoming = 0, more = true;
  while (more && S === s) {
    const res = await jpost(`${BASE}/${COL}/${s.roomId}:runQuery?${KQ}`, { structuredQuery: {
      from: [{ collectionId: 'messages' }],
      where: { fieldFilter: { field:{ fieldPath:'updatedAt' }, op:'GREATER_THAN', value:{ timestampValue: s.lastSync } } },
      orderBy: [{ field:{ fieldPath:'updatedAt' }, direction:'ASCENDING' }],
      limit: 200 } });
    const docs = res.filter(r => r.document).map(r => r.document);
    for (const d of docs) { if (await applyDoc(s, d)) incoming++; }
    if (docs.length) { s.lastSync = docs[docs.length - 1].fields.updatedAt.timestampValue; changed = true; s.lastActivity = Date.now(); }
    more = docs.length >= 200;
  }
  return { changed, incoming };
}
function setConn(ok){
  const el = $('subline');
  el.textContent = ok ? 'Connected' : 'Offline, retrying…';
  el.classList.toggle('off', !ok);
}
async function tick(){
  const s = S; if (!s) return;
  clearTimeout(s.timer);
  try {
    const { changed, incoming } = await pollOnce(s);
    if (S !== s) return;
    setConn(true);
    if (changed) {
      if (!isAtBottom()) s.unread += incoming;
      render(false);
      maybeSeen();
    }
  } catch (e) { if (S !== s) return; setConn(false); }
  schedule();
}
function schedule(){
  const s = S; if (!s) return;
  clearTimeout(s.timer);
  if (document.hidden) return;
  const idle = Date.now() - s.lastActivity;
  s.timer = setTimeout(tick, idle < 60000 ? 1500 : idle < 300000 ? 4000 : 8000);
}
document.addEventListener('visibilitychange', () => { if (S && !document.hidden) { S.lastActivity = Date.now(); tick(); } });
window.addEventListener('online', () => { if (S) tick(); });
const bump = () => { if (S) S.lastActivity = Date.now(); };
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, bump, { passive:true }));

/* ----- Seen ----- */
function maybeSeen(){
  const s = S; if (!s || document.hidden) return;
  const ids = [];
  for (const m of s.msgs.values()) if (m.sender !== ME && !m.deleted && !m.seen && !s.seenSent.has(m.id)) ids.push(m.id);
  if (!ids.length) return;
  ids.forEach(id => s.seenSent.add(id));
  commit(ids.map(id => ({
    update: { name: msgName(s.roomId, id), fields: { seen: FB(true) } },
    updateMask: { fieldPaths: ['seen'] }, updateTransforms: TR, currentDocument: { exists: true }
  }))).catch(() => ids.forEach(id => s.seenSent.delete(id)));
}

/* ----- Render ----- */
function isAtBottom(){ return list.scrollHeight - list.scrollTop - list.clientHeight < 140; }
function updateToBottom(){
  const at = isAtBottom();
  if (at && S) S.unread = 0;
  const show = !at && S && S.unread > 0;
  $('toBottom').classList.toggle('hidden', !show);
  $('newCnt').textContent = show ? String(S.unread) : '';
}
list.addEventListener('scroll', updateToBottom, { passive:true });
$('toBottom').addEventListener('click', () => { list.scrollTo({ top: list.scrollHeight, behavior:'smooth' }); });

function tickHtml(m){
  if (m.failed) return `<button class="retry" data-retry="${m.id}">Retry</button>`;
  if (m.pending) return `<span class="tick pend">${ic('clock')}</span>`;
  return `<span class="tick ${m.seen ? 'seen' : ''}">${ic(m.seen ? 'checks' : 'check')}</span>`;
}
function rowHtml(m){
  const mine = m.sender === ME;
  const sel = S.selected.has(m.id) ? ' sel' : '';
  const time = fmtTime.format(new Date(m.ts));
  let inner;
  if (m.deleted) {
    const who = m.delBy === ME ? 'You deleted this message' : 'This message was deleted';
    inner = `<div class="bubble deleted"><span>${ic('ban')}${who}</span></div>`;
  } else {
    inner = `<div class="bubble"><span class="txt-m">${esc(m.text)}</span><span class="meta">${time}${mine ? tickHtml(m) : ''}</span></div>`;
  }
  return `<div class="row ${mine ? 'mine' : 'theirs'}${sel}" data-id="${m.id}">${inner}</div>`;
}
function render(forceBottom){
  if (!S) return;
  const wasBottom = isAtBottom(), prevTop = list.scrollTop;
  const arr = [...S.msgs.values()].sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1));
  let html = '';
  if (!arr.length) html += `<div class="empty">No messages yet</div>`;
  let last = '';
  for (const m of arr) {
    const k = dayKey(m.ts);
    if (k !== last) { html += `<div class="day"><span>${dayLabel(m.ts)}</span></div>`; last = k; }
    html += rowHtml(m);
  }
  list.innerHTML = html;
  list.scrollTop = (forceBottom || wasBottom) ? list.scrollHeight : prevTop;
  updateToBottom();
}

/* ----- Send ----- */
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); }
});
$('sendBtn').addEventListener('mousedown', e => e.preventDefault());
$('sendBtn').addEventListener('click', send);

function send(){
  if (!S) return;
  const text = input.value.trim(); if (!text) return;
  input.value = ''; autosize(); input.focus();
  const id = randId(10), ts = Date.now();
  S.msgs.set(id, { id, ts, sender: ME, text, seen:false, deleted:false, pending:true });
  S.lastActivity = Date.now();
  render(true);
  pushMsg(id);
}
async function pushMsg(id){
  const s = S; if (!s) return;
  const m = s.msgs.get(id); if (!m) return;
  m.pending = true; m.failed = false;
  try {
    const { ct, iv } = await encryptText(s.key, m.text, id);
    await commit([{
      update: { name: msgName(s.roomId, id), fields: {
        ct: FS(ct), iv: FS(iv), snd: FS(ME), ts: { integerValue: String(m.ts) }, seen: FB(false), deleted: FB(false) } },
      updateTransforms: TR, currentDocument: { exists: false }
    }]);
    m.pending = false;
    if (S === s) setTimeout(tick, 150);
  } catch (e) { m.pending = false; m.failed = true; }
  if (S === s) render(false);
}

/* ----- Select & delete ----- */
let lp = null, lpFired = false, sx = 0, sy = 0;
const rowOf = (t) => t.closest('.row[data-id]');
list.addEventListener('pointerdown', (e) => {
  const row = rowOf(e.target); if (!row) return;
  lpFired = false; sx = e.clientX; sy = e.clientY; clearTimeout(lp);
  lp = setTimeout(() => { lpFired = true; toggleSel(row.dataset.id); if (navigator.vibrate) navigator.vibrate(15); }, 420);
});
list.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) clearTimeout(lp); });
['pointerup','pointercancel','pointerleave'].forEach(ev => list.addEventListener(ev, () => clearTimeout(lp)));
list.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (e.pointerType === 'mouse') { const row = rowOf(e.target); if (row) toggleSel(row.dataset.id); }
});
list.addEventListener('click', (e) => {
  if (lpFired) { lpFired = false; return; }
  const rt = e.target.closest('[data-retry]');
  if (rt) { pushMsg(rt.dataset.retry); render(false); return; }
  if (S && S.selected.size) { const row = rowOf(e.target); if (row) toggleSel(row.dataset.id); }
});
function toggleSel(id){
  if (!S) return;
  const m = S.msgs.get(id); if (!m || m.deleted || m.pending) return;
  if (S.selected.has(id)) S.selected.delete(id); else S.selected.add(id);
  const row = list.querySelector(`.row[data-id="${id}"]`);
  if (row) row.classList.toggle('sel', S.selected.has(id));
  updateSelBar();
}
function updateSelBar(){
  const n = S ? S.selected.size : 0;
  $('app').classList.toggle('selmode', n > 0);
  $('selCount').textContent = n + ' selected';
}
function clearSel(){
  if (!S) return;
  S.selected.clear();
  list.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
  updateSelBar();
}
$('selCancel').addEventListener('click', clearSel);
$('selCopy').addEventListener('click', async () => {
  if (!S) return;
  const txt = [...S.selected].map(id => S.msgs.get(id)).filter(Boolean).sort((a, b) => a.ts - b.ts).map(m => m.text).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch { toast('Copy failed'); }
  clearSel();
});
$('selDel').addEventListener('click', () => {
  if (!S || !S.selected.size) return;
  const n = S.selected.size;
  $('delText').textContent = `${n} message${n > 1 ? 's' : ''} will be deleted for everyone.`;
  $('delModal').classList.add('open');
});
$('delNo').addEventListener('click', closeModals);
$('delYes').addEventListener('click', async () => {
  const s = S; closeModals(); if (!s) return;
  const ids = [...s.selected].filter(id => { const m = s.msgs.get(id); return m && !m.deleted; });
  clearSel(); if (!ids.length) return;
  const backup = ids.map(id => ({ ...s.msgs.get(id) }));
  ids.forEach(id => { const m = s.msgs.get(id); s.msgs.set(id, { id, ts:m.ts, sender:m.sender, deleted:true, delBy:ME }); });
  render(false);
  try {
    await commit(ids.map(id => ({
      update: { name: msgName(s.roomId, id), fields: { deleted: FB(true), ct: FS(''), iv: FS(''), delBy: FS(ME) } },
      updateMask: { fieldPaths: ['deleted','ct','iv','delBy'] }, updateTransforms: TR, currentDocument: { exists: true }
    })));
    if (S === s) setTimeout(tick, 150);
  } catch (e) {
    backup.forEach(m => s.msgs.set(m.id, m));
    if (S === s) { render(false); toast('Delete failed. Try again.'); }
  }
});

/* ----- Misc ----- */
$('exitBtn').addEventListener('click', leaveChat);
$('pinBtn').addEventListener('click', () => S && showPin());
$('pinClose').addEventListener('click', closeModals);
$('pinCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(S.pin); toast('Copied'); } catch { toast('Copy failed'); }
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', (e) => { if (e.target === m) closeModals(); }));

/* Keep layout correct when the mobile keyboard opens */
const appEl = $('app');
function fitHeight(){
  const vv = window.visualViewport;
  appEl.style.height = (vv ? vv.height : window.innerHeight) + 'px';
  if (S && document.activeElement === input) list.scrollTop = list.scrollHeight;
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitHeight);
  visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0));
}
window.addEventListener('resize', fitHeight);
fitHeight();
</script>
</body>
</html>
