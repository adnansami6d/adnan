<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন - Jon the Don</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #f8fafc;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }

        /* মূল স্প্লিট কন্টেইনার (বাম পাশে ছবি, ডান পাশে ফর্ম) */
        .login-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .login-container {
                max-width: 880px;
                height: 560px;
                border-radius: 20px;
                flex-direction: row;
                border: 1px solid rgba(226, 232, 240, 0.8);
            }
        }

        /* বাম পাশ: জনের ছবি ও ব্র্যান্ডিং ব্যানার */
        .login-banner-side {
            width: 100%;
            height: 28%;
            background: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }

        @media (min-width: 768px) {
            .login-banner-side {
                width: 42%;
                height: 100%;
                padding: 24px;
            }
        }

        .login-banner-side img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.2));
        }

        .banner-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
        }

        .banner-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #34d399;
            margin-bottom: 2px;
        }

        .banner-content p {
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        /* ডান পাশ: রেজিস্ট্রেশন ফর্ম এরিয়া */
        .login-form-side {
            width: 100%;
            height: 72%;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            background: #ffffff;
        }

        @media (min-width: 768px) {
            .login-form-side {
                width: 58%;
                height: 100%;
                padding: 28px;
            }
        }

        .form-header {
            margin-bottom: 12px;
        }

        .form-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .form-header p {
            font-size: 0.78rem;
            color: #64748b;
        }

        .input-group {
            margin-bottom: 11px;
        }

        .input-group label {
            display: block;
            font-size: 0.76rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 9px 12px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: #10b981;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-submit:hover { background: #059669; }
        .btn-submit:active { transform: scale(0.99); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        .login-link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.78rem;
            color: #64748b;
        }

        .login-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover { text-decoration: underline; }

        #form-message {
            font-size: 0.76rem;
            text-align: center;
            margin-top: 8px;
            font-weight: 500;
            min-height: 16px;
        }

        .success-msg { color: #16a34a; }
        .error-msg { color: #dc2626; }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- বাম পাশ: জনের ছবি ও ব্র্যান্ডিং ব্যানার -->
        <div class="login-banner-side">
            <img src="https://i.ibb.co.com/gbLbq7pw/images.jpg" alt="Jon the Don">
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <h2>Jon the Don</h2>
                <p>নতুন অ্যাকাউন্ট তৈরি করুন এবং জ্ঞানের ভান্ডারে প্রবেশ করুন।</p>
            </div>
        </div>

        <!-- ডান পাশ: রেজিস্ট্রেশন ফর্ম এরিয়া -->
        <div class="login-form-side">
            <div class="form-header">
                <h1>নতুন একাউন্ট তৈরি করুন</h1>
                <p>ইবুক প্ল্যাটফর্মে প্রবেশ করতে আপনার তথ্য দিন</p>
            </div>

            <form id="registerForm">
                
                <!-- ১. নাম -->
                <div class="input-group">
                    <label for="userName"><i class="fa-solid fa-user"></i> সম্পূর্ণ নাম</label>
                    <input type="text" id="userName" placeholder="আপনার নাম লিখুন" required>
                </div>

                <!-- ২. ফোন / ইমেইল -->
                <div class="input-group">
                    <label for="userContact"><i class="fa-solid fa-envelope"></i> ফোন নম্বর বা ইমেইল</label>
                    <input type="text" id="userContact" placeholder="017xxxxxxxx অথবা example@mail.com" required>
                </div>

                <!-- ৩. পাসওয়ার্ড -->
                <div class="input-group">
                    <label for="userPassword"><i class="fa-solid fa-lock"></i> পাসওয়ার্ড</label>
                    <input type="password" id="userPassword" placeholder="পাসওয়ার্ড লিখুন" required>
                </div>

                <!-- ৪. শ্রেণি নির্বাচন -->
                <div class="input-group">
                    <label for="userClass"><i class="fa-solid fa-graduation-cap"></i> শ্রেণি নির্বাচন করুন</label>
                    <select id="userClass" required>
                        <option value="" disabled selected>শ্রেণি বেছে নিন</option>
                        <option value="HSC">HSC</option>
                        <option value="Honours philosophy">Honours philosophy</option>
                    </select>
                </div>

                <!-- ৫. প্রোফাইল ছবি আপলোড (ImgBB API) -->
                <div class="input-group">
                    <label for="profilePic"><i class="fa-solid fa-image"></i> প্রোফাইল ছবি (ঐচ্ছিক)</label>
                    <input type="file" id="profilePic" accept="image/*">
                </div>

                <!-- স্ট্যাটাস মেসেজ -->
                <div id="form-message"></div>

                <!-- সাবমিট বাটন -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    <span id="btnText">রেজিস্ট্রেশন করুন</span>
                </button>

                <div class="login-link">
                    ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="loginebok.html">লগইন করুন</a>
                </div>
            </form>
        </div>

    </div>

    <!-- JavaScript Script -->
    <script>
        const usersEndpoint = "https://firestore.googleapis.com/v1/projects/tournament-2d6d4/databases/(default)/documents/users";
        const apiKey = "?key=AIzaSyCNvnJsIn4-oKHLVv7-oNHCTskjE8";
        const imgbbApiKey = "510a6ffc6b41a46795f2acfce2f41847";

        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const formMessage = document.getElementById('form-message');

        // ৬ সংখ্যার অটো আইডি জেনারেটর
        function generateSixDigitId() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // SHA-256 পাসওয়ার্ড হ্যাশিং ফাংশন
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ImgBB-তে ছবি আপলোড করার ফাংশন
        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error("ছবি আপলোড ব্যর্থ হয়েছে!");
            }
        }

        // রেজিস্ট্রেশন ফর্ম সাবমিট
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const contact = document.getElementById('userContact').value.trim();
            const password = document.getElementById('userPassword').value;
            const selectedClass = document.getElementById('userClass').value;
            const profilePicFile = document.getElementById('profilePic').files[0];

            if (!name || !contact || !password || !selectedClass) {
                showFeedback('অনুগ্রহ করে প্রয়োজনীয় সব ঘর পূরণ করুন।', 'error');
                return;
            }

            setLoading(true);
            showFeedback('যাচাই করা হচ্ছে...', 'success');

            try {
                // ১. ডুপ্লিকেট ইমেইল বা ফোন নম্বর চেক করা
                const checkResponse = await fetch(usersEndpoint + apiKey);
                const checkData = await checkResponse.json();

                if (checkData.documents) {
                    let isDuplicate = false;
                    for (let doc of checkData.documents) {
                        const fields = doc.fields;
                        const dbContact = fields["Phone /email"] ? fields["Phone /email"].stringValue.trim() : "";
                        
                        if (dbContact === contact || dbContact === contact.replace(/^0+/, '') || contact === dbContact.replace(/^0+/, '')) {
                            isDuplicate = true;
                            break;
                        }
                    }

                    if (isDuplicate) {
                        showFeedback('এই ফোন নম্বর বা ইমেইল দিয়ে ইতিমধ্যে একটি অ্যাকাউন্ট রয়েছে!', 'error');
                        setLoading(false);
                        return;
                    }
                }

                // ২. প্রোফাইল পিক আপলোড (যদি দেওয়া হয়ে থাকে)
                let profilePicUrl = "https://via.placeholder.com/150"; // ডিফল্ট ছবি
                if (profilePicFile) {
                    showFeedback('ছবি আপলোড করা হচ্ছে...', 'success');
                    profilePicUrl = await uploadImageToImgBB(profilePicFile);
                }

                // ৩. আইডি জেনারেট এবং পাসওয়ার্ড হ্যাশিং
                const userId = generateSixDigitId();
                const hashedPassword = await hashPassword(password);

                // ৪. ফায়ারবেজ প্যালোড তৈরি
                const payload = {
                    fields: {
                        "users Name": { stringValue: name },
                        "I'd": { stringValue: userId },
                        "Passhas": { stringValue: hashedPassword },
                        "Phone /email": { stringValue: contact },
                        "userclass": { stringValue: selectedClass },
                        "level": { stringValue: "free" },
                        "userLevel": { integerValue: 1 },
                        "profile pic": { stringValue: profilePicUrl },
                        "createdAt": { timestampValue: new Date().toISOString() }
                    }
                };

                // ৫. ফায়ারবেজে ডেটা সেভ (POST)
                showFeedback('রেজিস্ট্রেশন সম্পূর্ণ করা হচ্ছে...', 'success');
                const response = await fetch(usersEndpoint + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // ৬. লোকাল স্টোরেজ সেশন তৈরি (এখানে profilePic যোগ করা হয়েছে যাতে হোম পেজে ছবি দেখায়)
                    const sessionExpiryDays = 6;
                    const expiryDate = new Date().getTime() + (sessionExpiryDays * 24 * 60 * 60 * 1000);
                    
                    const sessionToken = await hashPassword(userId + "_" + expiryDate);

                    const userSession = {
                        userId: userId,
                        userName: name,
                        userClass: selectedClass,
                        level: "free",
                        profilePic: profilePicUrl, // <--- ফিক্সড: সেশনে প্রোফাইল ছবির লিংক যুক্ত করা হলো[span_1](start_span)[span_1](end_span)
                        token: sessionToken,
                        expiresAt: expiryDate
                    };

                    localStorage.setItem('userSession', JSON.stringify(userSession));

                    showFeedback('রেজিস্ট্রেশন সফল হয়েছে! রিডাইরেক্ট করা হচ্ছে...', 'success');

                    // ৭. ইবুক পেজে রিডাইরেক্ট
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1200);

                } else {
                    showFeedback('রেজিস্ট্রেশন সফল হয়নি। আবার চেষ্টা করুন।', 'error');
                }

            } catch (err) {
                console.error("Registration Error:", err);
                showFeedback('একটি ত্রুটি ঘটেছে! নেটওয়ার্ক সংযোগ যাচাই করুন।', 'error');
            } finally {
                setLoading(false);
            }
        });

        function showFeedback(msg, type) {
            formMessage.textContent = msg;
            formMessage.className = type === 'error' ? 'error-msg' : 'success-msg';
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.style.display = 'none';
                if (!document.querySelector('.spinner')) {
                    const spinner = document.createElement('div');
                    spinner.className = 'spinner';
                    submitBtn.appendChild(spinner);
                }
            } else {
                btnText.style.display = 'inline';
                const spinner = document.querySelector('.spinner');
                if (spinner) spinner.remove();
            }
        }
    </script>
</body>
</html>
