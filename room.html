<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লুডো অনলাইন - রুম তৈরি ও জয়েন</title>
    <!-- PeerJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-create {
            background-color: #28a745;
            color: white;
        }

        .btn-create:hover { background-color: #218838; }

        .btn-join {
            background-color: #007bff;
            color: white;
        }

        .btn-join:hover { background-color: #0069d9; }

        .btn-reconnect {
            background-color: #ff9800;
            color: white;
        }

        .divider {
            margin: 15px 0;
            font-weight: bold;
            color: #777;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .room-display {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
        }

        .room-code {
            font-size: 22px;
            font-weight: bold;
            color: #d9534f;
            letter-spacing: 2px;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            font-weight: bold;
        }

        #reconnect-box {
            display: none;
            background: #fff3cd;
            padding: 10px;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>অনলাইন লুডো গেম</h2>

        <!-- রিকানেক্ট অপশন (যদি আগে খেলা শুরু হয়ে থাকে) -->
        <div id="reconnect-box">
            <p style="font-size: 13px; color: #856404; margin-bottom: 5px;">আপনি একটি চলমান গেম থেকে বিচ্ছিন্ন হয়েছেন!</p>
            <button class="btn btn-reconnect" onclick="reconnectPreviousGame()">পূর্বের গেমে পুনরায় যুক্ত হন</button>
        </div>

        <!-- রুম ক্রিয়েট সেকশন -->
        <button id="create-btn" class="btn btn-create" onclick="createNewRoom()">নতুন রুম ক্রিয়েট করুন</button>

        <div id="room-info" class="room-display">
            <p style="font-size: 13px; color: #555;">আপনার রুম আইডি (অপনেন্টকে শেয়ার করুন):</p>
            <span id="created-room-code" class="room-code">------</span>
        </div>

        <div class="divider">অথবা</div>

        <!-- রুমে জয়েন সেকশন -->
        <input type="text" id="room-code-input" placeholder="রুম কোড দিন (যেমন: 123456)">
        <button class="btn btn-join" onclick="joinExistingRoom()">রুম জয়েন করুন</button>

        <div id="status-message" class="status-msg"></div>
    </div>

    <script>
        let peer = null;
        let myFullId = "";

        // ১. পেজ লোড হলে চেক করবে আগের কোনো গেম সেশন আছে কিনা
        window.onload = () => {
            const savedRoom = localStorage.getItem('ludo_room_id');
            const savedRole = localStorage.getItem('ludo_player_role');
            if (savedRoom && savedRole) {
                document.getElementById('reconnect-box').style.display = 'block';
            }
        };

        // ২. PeerJS ইনিশিয়ালাইজ করা (Google STUN Server সহ)
        function initPeer(customCode) {
            myFullId = 'ludo-' + customCode;
            peer = new Peer(myFullId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                },
                secure: true
            });

            peer.on('error', (err) => {
                console.error("Peer Error:", err);
                if (err.type === 'unavailable-id') {
                    alert("এই রুম আইডিটি বর্তমানে ব্যবহৃত হচ্ছে। অন্য কোড দিয়ে চেষ্টা করুন।");
                } else {
                    document.getElementById('status-message').innerText = "এরর: " + err.type;
                }
            });
        }

        // ৩. নতুন রুম ক্রিয়েট করা (Host - Red Player)
        function createNewRoom() {
            const rawCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('created-room-code').innerText = rawCode;
            document.getElementById('room-info').style.display = 'block';
            document.getElementById('status-message').innerText = 'অপনেন্টের জন্য অপেক্ষা করা হচ্ছে...';

            initPeer(rawCode);

            // অপনেন্ট কানেক্ট করলে ইভেন্ট
            peer.on('connection', (conn) => {
                document.getElementById('status-message').innerText = 'প্লেয়ার যুক্ত হয়েছে! খেলা শুরু হচ্ছে...';
                
                // গেম তথ্য LocalStorage এ সেভ রাখা (রিকানেক্টের জন্য)
                localStorage.setItem('ludo_room_id', rawCode);
                localStorage.setItem('ludo_player_role', 'red');
                localStorage.setItem('ludo_is_host', 'true');

                // অপনেন্টকে কানেকশন নিশ্চিত করে গেম পেজে রিডাইরেক্ট করা
                conn.on('open', () => {
                    conn.send({ type: 'GAME_START' });
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                });
            });
        }

        // ৪. বিদ্যমান রুমে জয়েন করা (Guest - Yellow Player)
        function joinExistingRoom() {
            let inputCode = document.getElementById('room-code-input').value.trim();
            if (!inputCode) {
                alert('দয়া করে রুম কোড দিন!');
                return;
            }

            // 'ludo-' প্রিফিক্স হ্যান্ডলিং
            if (inputCode.startsWith('ludo-')) {
                inputCode = inputCode.replace('ludo-', '');
            }

            const guestCode = Math.floor(100000 + Math.random() * 900000).toString();
            initPeer(guestCode);

            peer.on('open', () => {
                document.getElementById('status-message').innerText = 'হস্টের সাথে কানেক্ট হচ্ছে...';
                const hostFullId = 'ludo-' + inputCode;
                const conn = peer.connect(hostFullId);

                conn.on('open', () => {
                    document.getElementById('status-message').innerText = 'কানেক্টেড! খেলা শুরু হচ্ছে...';
                    
                    localStorage.setItem('ludo_room_id', inputCode);
                    localStorage.setItem('ludo_player_role', 'yellow');
                    localStorage.setItem('ludo_is_host', 'false');

                    setTimeout(() => {
                        window.location.href = 'ludo.html';
                    }, 1000);
                });

                conn.on('error', (err) => {
                    alert("রুম কোডটি সঠিক নয় অথবা হোস্ট অফলাইনে রয়েছে!");
                });
            });
        }

        // ৫. ডিসকানেক্ট হওয়ার পর আবার রি-কানেক্ট হওয়া
        function reconnectPreviousGame() {
            const savedRoom = localStorage.getItem('ludo_room_id');
            if (savedRoom) {
                document.getElementById('status-message').innerText = 'পুনরায় গেমে রি-ডাইরেক্ট করা হচ্ছে...';
                setTimeout(() => {
                    window.location.href = 'ludo.html';
                }, 500);
            }
        }
    </script>
</body>
</html>
