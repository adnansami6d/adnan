<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adnan- Daily Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        /* Top Header Area */
        .header {
            background-color: #15803d;
            color: #ffffff;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.1);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-picker-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .date-picker-wrap:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .date-picker-wrap svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .date-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Status Content Card */
        .status-card {
            background-color: #ffffff;
            padding: 30px 24px 22px 24px;
            position: relative;
        }

        .status-text {
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.65;
            margin-bottom: 14px;
            color: #0f172a;
            letter-spacing: -0.2px;
        }

        .sub-credits {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 18px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
        }

        .en-translation {
            font-size: 0.98rem;
            color: #475569;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            line-height: 1.5;
            border-top: 1px solid #f1f5f9;
            padding-top: 14px;
        }

        /* Media Display */
        .media-container {
            width: 100%;
            max-height: 480px;
            overflow: hidden;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Reactions Section */
        .reactions-bar {
            padding: 14px 22px;
            background: #f8fafc;
            display: flex;
            gap: 12px;
            align-items: center;
            overflow-x: auto;
            border-bottom: 1px solid #e2e8f0;
        }

        .react-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .react-btn:hover {
            border-color: #15803d;
            color: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }

        /* Comments Section */
        .comments-section {
            padding: 22px;
            background: #ffffff;
        }

        .comments-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comments-title svg {
            width: 20px;
            height: 20px;
            fill: #15803d;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .comment-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .comment-author {
            font-weight: 700;
            font-size: 0.92rem;
            color: #0f172a;
        }

        .comment-time {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .comment-text {
            font-size: 0.92rem;
            color: #334155;
            line-height: 1.5;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .comment-input, .comment-textarea {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .comment-input:focus, .comment-textarea:focus {
            border-color: #15803d;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.1);
        }

        .comment-textarea {
            resize: none;
            height: 65px;
        }

        .submit-btn {
            align-self: flex-end;
            background: #15803d;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(21, 128, 61, 0.2);
        }

        .submit-btn:hover {
            background: #166534;
            transform: translateY(-1px);
        }

        .no-data {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <span>© adnan</span>
        </div>
        <div class="date-picker-wrap">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            <input type="date" id="datePicker" class="date-input" onchange="filterBySelectedDate()">
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="contentArea">
        <div class="loading">ডেটা লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
    </div>
</div>

<script>
    const sheetId = '1VUqMP-jag335---OBaQ4JStkcKskGlbD8Xvte102ZIs';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

    let allData = [];
    let selectedDate = '';

    async function loadSheetData() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            allData = parseCSV(csvText);

            if (allData.length > 0) {
                const latest = allData[allData.length - 1];
                selectedDate = formatDateString(latest.Date || latest.date) || new Date().toISOString().split('T')[0];
                document.getElementById('datePicker').value = selectedDate;
                renderContent(selectedDate);
            } else {
                document.getElementById('contentArea').innerHTML = `<div class="no-data">কোনো তথ্য পাওয়া যায়নি।</div>`;
            }
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('contentArea').innerHTML = `<div class="no-data">ডেটা লোড করতে সমস্যা হয়েছে। গুগল শিটের পাবলিশ লিংক যাচাই করুন।</div>`;
        }
    }

    function parseCSV(text) {
        const lines = text.trim().split(/\r\n|\n/);
        if (lines.length < 2) return [];

        const headers = parseCSVLine(lines[0]);
        const result = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const currentLine = parseCSVLine(lines[i]);
            const obj = {};
            headers.forEach((header, index) => {
                obj[header.trim()] = currentLine[index] ? currentLine[index].trim() : '';
            });
            result.push(obj);
        }
        return result;
    }

    function parseCSVLine(line) {
        const result = [];
        let insideQuote = false;
        let entry = '';

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                insideQuote = !insideQuote;
            } else if (char === ',' && !insideQuote) {
                result.push(entry);
                entry = '';
            } else {
                entry += char;
            }
        }
        result.push(entry);
        return result;
    }

    function formatDateString(rawDate) {
        if (!rawDate) return '';
        let cleanDate = rawDate.trim();
        if (cleanDate.includes('/')) {
            let parts = cleanDate.split('/');
            if (parts.length === 3) {
                let month = parts[0].padStart(2, '0');
                let day = parts[1].padStart(2, '0');
                let year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
                return `${year}-${month}-${day}`;
            }
        }
        return cleanDate;
    }

    function filterBySelectedDate() {
        const pickerVal = document.getElementById('datePicker').value;
        if (pickerVal) {
            selectedDate = pickerVal;
            renderContent(selectedDate);
        }
    }

    function renderContent(targetDate) {
        const statusRows = allData.filter(item => {
            let rowDate = formatDateString(item.Date || item.date);
            return rowDate === targetDate && item.status;
        });

        const commentRows = allData.filter(item => {
            let rowDate = formatDateString(item.Date || item.date);
            return rowDate === targetDate && item.comment;
        });

        if (statusRows.length === 0) {
            document.getElementById('contentArea').innerHTML = `
                <div class="no-data">
                    <p style="font-size: 1.15rem; font-weight: 700; color: #334155; margin-bottom: 6px;">${targetDate} তারিখে কোনো স্ট্যাটাস নেই</p>
                    <p style="font-size: 0.88rem;">ক্যালেন্ডার থেকে অন্য তারিখ বেছে নিন।</p>
                </div>
            `;
            return;
        }

        const currentStatus = statusRows[0];

        let html = `
            <div class="status-card">
                <div class="status-text">${escapeHTML(currentStatus.status)}</div>
                <div class="sub-credits">social media video clip collected editor own</div>
                ${currentStatus['s.en.translation'] ? `<div class="en-translation">${escapeHTML(currentStatus['s.en.translation'])}</div>` : ''}
            </div>
        `;

        if (currentStatus['s.pic.link']) {
            html += `
                <div class="media-container">
                    <img src="${currentStatus['s.pic.link']}" alt="Status Image" onerror="this.style.display='none'">
                </div>
            `;
        }

        html += `
            <div class="reactions-bar">
                <button class="react-btn" onclick="addReaction('love')">❤️ <span>Love</span></button>
                <button class="react-btn" onclick="addReaction('like')">👍 <span>Like</span></button>
                <button class="react-btn" onclick="addReaction('fire')">🔥 <span>Fire</span></button>
                <button class="react-btn" onclick="addReaction('sad')">🥺 <span>Sad</span></button>
            </div>
        `;

        html += `
            <div class="comments-section">
                <div class="comments-title">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    <span>মন্তব্যসমূহ (${commentRows.length})</span>
                </div>
                
                <div class="comment-list" id="commentList">
        `;

        if (commentRows.length > 0) {
            commentRows.forEach(c => {
                html += `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHTML(c['comment.name'] || 'অজ্ঞাত')}</span>
                            <span class="comment-time">${escapeHTML(c['comment.date'] || '')}</span>
                        </div>
                        <div class="comment-text">${escapeHTML(c.comment)}</div>
                    </div>
                `;
            });
        } else {
            html += `<div style="color: #94a3b8; font-size: 0.88rem; padding: 6px 0;">প্রথম মন্তব্যটি আপনি করুন!</div>`;
        }

        html += `
                </div>

                <form class="comment-form" onsubmit="submitComment(event)">
                    <input type="text" id="commenterName" class="comment-input" placeholder="আপনার নাম..." required>
                    <textarea id="commentText" class="comment-textarea" placeholder="আপনার মতামত লিখুন..." required></textarea>
                    <button type="submit" class="submit-btn">
                        <span>পাঠিয়ে দিন</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </form>
            </div>
        `;

        document.getElementById('contentArea').innerHTML = html;
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function addReaction(type) {
        alert(`${type.toUpperCase()} রিঅ্যাকশন দেওয়া হয়েছে!`);
    }

    async function submitComment(e) {
        e.preventDefault();
        const name = document.getElementById('commenterName').value.trim();
        const comment = document.getElementById('commentText').value.trim();
        const now = new Date().toLocaleDateString('bn-BD');

        if (!name || !comment) return;

        const commentList = document.getElementById('commentList');
        commentList.innerHTML += `
            <div class="comment-item">
                <div class="comment-header">
                    <span class="comment-author">${escapeHTML(name)}</span>
                    <span class="comment-time">${now}</span>
                </div>
                <div class="comment-text">${escapeHTML(comment)}</div>
            </div>
        `;

        document.getElementById('commentText').value = '';
    }

    window.onload = loadSheetData;
</script>

</body>
    </html>
